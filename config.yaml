# Response Review Assistant — ค่าทุกอย่างที่ปรับได้อยู่ที่นี่ที่เดียว
data:
  raw_path: data/raw/Amazon_Reviews.csv
  processed_path: data/processed/reviews_clean.parquet
  min_text_length: 20
 
embedding:
  model_name: sentence-transformers/all-MiniLM-L6-v2
  batch_size: 64
  normalize: true
 
vectorstore:
  persist_path: chroma_db
  collection_name: amazon_reviews
  distance: cosine
 
retrieval:
  top_k: 5
 
evaluation:
  test_set_path: eval/test_set.yaml
  k_values: [1, 3, 5, 10]